# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 孑叶的笔记本
  pageTitleSuffix: "孑叶的笔记本"   # quartz\components\Head.tsx
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: kazelee.github.io/notebook
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .vscode
    - .doc
    - Clippings
    - template
    - AGENTS.md
    - CLAUDE.md
  theme:
    # 页面字体由 quartz/styles/custom.scss 的 :root 变量覆盖为 寒蝉全圆体（优先级最高）
    # 此处保留 Google Fonts 可用的字体，供 og-image 插件渲染社交分享图时抓取/缓存
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Noto Sans SC
      body: Noto Sans SC
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: false
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      highlight: false   # ==高亮== 交给 quartz_highlight_colors 接管，支持内部嵌套 Markdown
    order: 30
  - source: "@obsidian-tutorial/emoji-shortcodes"
    enabled: true
    order: 35
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    options:
      minEntries: 0   # 默认为 1，但是如果只有 1 个标题就不会显示，正常还是应该显示的
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: local
      title: 寒蝉全圆体
      body: 寒蝉全圆体
      header: 寒蝉全圆体
      code: JetBrains Mono
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 60
  - source: "@quartz-community/explorer"
    enabled: false
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 40
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    options:
      hideWhenEmpty: true
    layout:
      position: right
      priority: 60
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: false   # 直接关掉这个就不会显示日期和阅读时间了
    options:
      showReadingTime: false   # 这个是专门用来关阅读时间的
      showComma: false         # 这个是说明两个元数据之间是否需要显示逗号
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
      display: desktop-only
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: left
      priority: 40
      display: desktop-only
      condition: not-index
  # 既然不能支持桌面端和移动端的分支判断，自定义不同的位置，那只能开两个，然后分别设置了
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      display: mobile-only
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/kazelee/notebook
        Font: https://github.com/Warren2060/ChillRound
        Theme Reference: https://fdscend.github.io/obsidian_tutorial/
  - source: "@quartz-community/recent-notes"
    enabled: false
    options:
      title: 固定的文档
      limit: 1
      showTags: false
      hideTagPages: true
      hideFolderPages: true
      linkToMore: "bases/"
    order: 50
    layout:
      position: left
      priority: 45
      display: all
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        # - aliases   # Obsidian 工作区自己用就行了，没必要在网页里面展示
        - permalink
        - source   # 自用，显示 copy 文档的来源
        - urls     # 自用，显示该文章被发布到哪些网点
      excludedProperties: []
      hidePropertiesView: false
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/stacked-pages"
    enabled: false
  - source: github:FDscend/quartz_highlight_colors#v0.2.0
    enabled: true
    order: 36
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
