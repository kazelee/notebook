# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 孑叶的笔记本
  pageTitleSuffix: " | 孑叶的笔记本"
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: 'kazelee.github.io/notebook/'
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .vscode
    - .doc
    - Clippings
    - template
    - AGENTS.md
    - CLAUDE.md
  theme:
    fontOrigin: local
    cdnCaching: true
    typography:
      header: Noto Sans SC
      body: Noto Sans SC
      code: JetBrains Mono
    colors:
      lightMode:
        light: "#faf8f8"
        lightgray: "#e5e5e5"
        gray: "#b8b8b8"
        darkgray: "#4e4e4e"
        dark: "#2b2b2b"
        secondary: "#284b63"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#fff23688"
      darkMode:
        light: "#161618"
        lightgray: "#393639"
        gray: "#646464"
        darkgray: "#d4d4d4"
        dark: "#ebebec"
        secondary: "#7b97aa"
        tertiary: "#84a59d"
        highlight: rgba(143, 159, 169, 0.15)
        textHighlight: "#b3aa0288"
  links:
    markdownLinkResolution: shortest
  contentIndex:
    enableSiteMap: true
    enableRSS: true
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: false
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      enableInHtmlEmbed: false
      enableCheckbox: true
      highlight: false # ==高亮== 交给 quartz_highlight_colors 接管，支持内部嵌套 Markdown
    order: 30
  # - source: github:obsidian-tutorial/emoji-shortcodes"
  #   enabled: true
  #   order: 35
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    options:
      maxDepth: 6 # 默认为 3，但有时需要引用查找 4 级以下的标题，还是需要显示的
      minEntries: 0 # 默认为 1，但是如果只有 1 个标题就不会显示，正常还是应该显示的
    layout:
      position: left
      priority: 50
      display: desktop-only
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      fontOrigin: local
      # interface: LXGW 975 Yuan SC
      title: LXGW 975 Yuan SC
      body: LXGW 975 Yuan SC
      header: LXGW 975 Yuan SC
      code: JetBrains Mono
  - source: "@quartz-community/alias-redirects"
    enabled: false   # 别名用于 Obsidian 工作区内部引用，不需要体现在链接上
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: false   # 构建耗时，使用场景有限，字体受限，标题拼接无法自定义
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: false # 放弃使用自带的 tags，包括样式调整
    order: 50
    layout:
      position: right
      priority: 60
  - source: "@quartz-community/explorer"
    enabled: false
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 40
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    options:
      hideWhenEmpty: true
    layout:
      position: right
      priority: 60
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: false # 直接关掉这个就不会显示日期和阅读时间了
    options:
      showReadingTime: false # 这个是专门用来关阅读时间的
      showComma: false # 这个是说明两个元数据之间是否需要显示逗号
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
  - source: "@quartz-community/page-title"
    enabled: true
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  - source: "@quartz-community/reader-mode"
    enabled: false
    layout:
      position: left
      priority: 35
      group: toolbar
      display: desktop-only
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      spacerSymbol: "❯"
      rootName: '主页'
    layout:
      position: left
      priority: 40
      display: desktop-only
      condition: not-index
  # 既然不能支持桌面端和移动端的分支判断，自定义不同的位置，那只能开两个，然后分别设置了
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    options:
      spacerSymbol: "❯"
      rootName: '主页'
    layout:
      position: beforeBody
      priority: 5
      display: mobile-only
      condition: not-index
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/kazelee/notebook
        Font: https://github.com/lxgw/975Yuan
        Theme Reference: https://github.com/Akifyss/obsidian-border
  - source: "@quartz-community/recent-notes"
    enabled: false
    options:
      title: 固定的文档
      limit: 1
      showTags: false
      hideTagPages: true
      hideFolderPages: true
      linkToMore: "bases/"
    order: 50
    layout:
      position: left
      priority: 45
      display: all
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        # - tags   # 放弃使用自带的 tags，包括样式调整
        - aliases
        - wikitags
        - source # 自用，显示 copy 文档的来源
        - urls # 自用，显示该文章被发布到哪些网点
      excludedProperties: []
      hidePropertiesView: false
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/unlisted-pages"
    enabled: true
  - source: "@quartz-community/stacked-pages"
    enabled: false
  - source: github:FDscend/quartz_highlight_colors#v0.2.0
    enabled: true
    order: 36
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
